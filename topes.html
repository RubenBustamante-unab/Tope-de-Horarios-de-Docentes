<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reporte de Topes de Horario</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  body{font-family:Segoe UI,Arial,sans-serif;background:#f4f5f7;margin:0;padding:40px;color:#222}
  .card{max-width:820px;margin:auto;background:#fff;border-radius:10px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h1{color:#C00000;font-size:22px;margin:0 0 4px}
  p.sub{color:#666;margin:0 0 24px;font-size:14px}
  #drop{border:2px dashed #C00000;border-radius:8px;padding:40px;text-align:center;color:#888;cursor:pointer;transition:.2s}
  #drop.hover{background:#fff5f5;color:#C00000}
  #drop p{margin:0 0 14px}
  #browseBtn{background:#C00000;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:14px;cursor:pointer}
  #browseBtn:hover{background:#a30000}
  button{background:#C00000;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:14px;cursor:pointer;margin-top:16px}
  button:disabled{background:#bbb;cursor:default}
  #log{margin-top:20px;font-size:13px;white-space:pre-wrap;background:#fafafa;border-left:3px solid #C00000;padding:12px;display:none}
  table{border-collapse:collapse;width:100%;margin-top:20px;font-size:12px}
  th{background:#C00000;color:#fff;padding:6px;text-align:left}
  td{border:1px solid #ddd;padding:5px}
  #visitas{position:fixed;top:14px;right:16px;font-size:12px;color:#999;z-index:10}
  #visitas img{vertical-align:middle;height:20px}
  #filtroUA{margin-top:20px;display:none}
  #filtroUA label.titulo{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#444}
  #uaBuscar{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;padding:9px 10px;font-size:13px}
  #uaTodoFila{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px;font-weight:600;color:#444;border:1px solid #ccc;border-top:0;background:#fafafa}
  #uaTodoFila input{accent-color:#C00000;width:15px;height:15px;cursor:pointer}
  #uaTodoFila span{cursor:pointer}
  #uaLista{max-height:180px;overflow-y:auto;border:1px solid #ccc;border-top:0;border-radius:0 0 6px 6px;padding:4px 10px}
  .ua-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid #f0f0f0}
  .ua-item:last-child{border-bottom:0}
  .ua-item input{accent-color:#C00000;width:15px;height:15px;cursor:pointer}
  .ua-item span{cursor:pointer}
  #filtroUA p.hint{margin:6px 0 0;font-size:12px;color:#888}
  #filtroUA p.vacio{margin:8px 2px;font-size:12px;color:#aaa}
</style>
</head>
<body>
<div id="visitas">
  <img src="https://visitor-badge.laobi.icu/badge?page_id=rubenbustamante-unab.tope-de-horarios-de-docentes&left_text=Visitas&left_color=8f0000&right_color=C00000" alt="Contador de visitas">
</div>
<div class="card">
  <h1>Reporte de Topes de Horario</h1>
  <p class="sub">Sube la Programación Académica (.xlsx). El procesamiento ocurre en tu equipo; ningún dato sale del navegador.</p>
  <div id="drop">
    <p>Arrastra el archivo aquí</p>
    <button type="button" id="browseBtn">Buscar archivo en el equipo</button>
    <input type="file" id="file" accept=".xlsx,.xls" hidden>
  </div>
  <div id="filtroUA">
    <label class="titulo">Unidad(es) académica(s)</label>
    <input type="text" id="uaBuscar" placeholder="Buscar unidad académica…">
    <label id="uaTodoFila"><input type="checkbox" id="uaTodo"><span>Seleccionar todo</span></label>
    <div id="uaLista"></div>
    <p class="hint">Marca una o más. Si no marcas ninguna, se incluyen todas.</p>
  </div>
  <button id="dl" disabled>Descargar reporte (.xlsx)</button>
  <div id="log"></div>
  <div id="prev"></div>
</div>

<script>
const FIRST_ROW = 12;                    // datos desde la fila 12 (se ignoran las 10 primeras + encabezados)
const C = {campus:1, unidad:2, materia:4, curso:5, nrc:8, listas:9, prof:15, asig:16, horario:20}; // B,C,E,F,I,J,P,Q,U
const NOM = {LU:"Lunes",MA:"Martes",MI:"Miércoles",JU:"Jueves",VI:"Viernes",SA:"Sábado",DO:"Domingo"};
const ORD = {LU:1,MA:2,MI:3,JU:4,VI:5,SA:6,DO:7};
const HDR = ["Profesor","Día","Código Asignatura 1","Asignatura 1","NRC 1","Campus 1","Horario 1",
             "Código Asignatura 2","Asignatura 2","NRC 2","Campus 2","Horario 2"];
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const txt = v => (v===undefined||v===null) ? "" : String(v).trim();

let reporte = null, rawRecs = [], unidadesTodas = [], seleccionUA = new Set();
const drop=document.getElementById("drop"), inp=document.getElementById("file"),
      dl=document.getElementById("dl"), log=document.getElementById("log"), prev=document.getElementById("prev"),
      browseBtn=document.getElementById("browseBtn"), filtroUA=document.getElementById("filtroUA"),
      uaBuscar=document.getElementById("uaBuscar"), uaLista=document.getElementById("uaLista"),
      uaTodo=document.getElementById("uaTodo");

uaBuscar.oninput = () => renderUAList(uaBuscar.value);
uaLista.addEventListener("change", e => {
  if(e.target.type !== "checkbox") return;
  if(e.target.checked) seleccionUA.add(e.target.value); else seleccionUA.delete(e.target.value);
  actualizarUaTodo();
  generarReporte();
});
uaTodo.onchange = () => {
  seleccionUA = uaTodo.checked ? new Set(unidadesTodas) : new Set();
  renderUAList(uaBuscar.value);
  generarReporte();
};

function actualizarUaTodo(){
  const total = unidadesTodas.length;
  uaTodo.checked = total > 0 && seleccionUA.size === total;
  uaTodo.indeterminate = seleccionUA.size > 0 && seleccionUA.size < total;
}

function renderUAList(filtro=""){
  const f = filtro.trim().toLowerCase();
  const visibles = unidadesTodas.filter(u => u.toLowerCase().includes(f));
  uaLista.innerHTML = visibles.length
    ? visibles.map(u => `<label class="ua-item"><input type="checkbox" value="${u}" ${seleccionUA.has(u)?"checked":""}><span>${u}</span></label>`).join("")
    : `<p class="vacio">Sin coincidencias.</p>`;
  actualizarUaTodo();
}

// Botón explícito para buscar archivo en el equipo
browseBtn.onclick = (e) => { e.stopPropagation(); inp.click(); };

// La zona también permite clic para buscar (excepto sobre el botón, ya manejado arriba)
drop.onclick = () => inp.click();
drop.ondragover = e => {e.preventDefault(); drop.classList.add("hover");};
drop.ondragleave = () => drop.classList.remove("hover");
drop.ondrop = e => {e.preventDefault(); drop.classList.remove("hover"); if(e.dataTransfer.files[0]) procesar(e.dataTransfer.files[0]);};
inp.onchange = () => { if(inp.files[0]) procesar(inp.files[0]); };

function msg(t){ log.style.display="block"; log.textContent = t; }

async function procesar(file){
  msg("Leyendo " + file.name + " …");
  const wb = XLSX.read(await file.arrayBuffer(), {cellDates:false});
  // Hoja base: la que tenga "Nombre Profesor" y "Horario" en la fila 11 (independiente del nombre)
  let rows = null, hojaUsada = null;
  for (const name of wb.SheetNames){
    const r = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, blankrows:true, defval:""});
    const h = (r[10]||[]).map(v => txt(v).toUpperCase());
    if (h[C.prof]==="NOMBRE PROFESOR" && h[C.horario]==="HORARIO"){ rows=r; hojaUsada=name; break; }
  }
  if(!rows){ rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, blankrows:true, defval:""}); hojaUsada = wb.SheetNames[0]; }

  // ---- Parseo de bloques horarios ----
  const recs = [];
  for (let i = FIRST_ROW-1; i < rows.length; i++){
    const row = rows[i] || [];
    const pStr = txt(row[C.prof]), hStr = txt(row[C.horario]);
    if(!pStr || !hStr) continue;
    for (let pn of pStr.split("/")){
      pn = pn.trim().toUpperCase();
      if(!pn || pn.includes("POR DEFINIR")) continue;
      for (const bq of hStr.split("/")){
        const t = bq.replace(/\./g," ").trim().split(/\s+/);
        if(t.length < 4) continue;
        const a = parseInt(t[1],10), b = parseInt(t[t.length-1],10);
        if(!a || !b) continue;
        const ini = Math.floor(a/100)*60 + a%100, fin = Math.floor(b/100)*60 + b%100;
        if(ini<=0 || fin<=ini) continue;
        recs.push({prof:pn, dia:t[0].substring(0,2).toUpperCase(), ini, fin, fila:i+1,
          nrc:txt(row[C.nrc]), camp:txt(row[C.campus]), ua:txt(row[C.unidad]),
          cod:txt(row[C.materia]) + txt(row[C.curso]),
          asig:txt(row[C.asig]), lc:txt(row[C.listas]).toUpperCase()});
      }
    }
  }

  rawRecs = recs;

  // ---- Poblar el filtro de unidades académicas ----
  unidadesTodas = [...new Set(recs.map(x => x.ua).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  seleccionUA = new Set();
  uaBuscar.value = "";
  renderUAList();
  filtroUA.style.display = unidadesTodas.length ? "block" : "none";

  msg(`Hoja procesada: ${hojaUsada}\nBloques horarios analizados: ${recs.length}`);
  generarReporte();
}

function generarReporte(){
  const seleccion = [...seleccionUA];
  const recs = seleccion.length ? rawRecs.filter(x => seleccion.includes(x.ua)) : rawRecs;

  // ---- Detección de topes (agrupado por profesor+día) ----
  const grupos = new Map();
  recs.forEach(x => { const k = x.prof+"|"+x.dia; (grupos.get(k) || grupos.set(k,[]).get(k)).push(x); });
  const vistos = new Set(), pares = [];
  for (const arr of grupos.values()){
    arr.sort((x,y)=>x.ini-y.ini);
    for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
      const a=arr[i], b=arr[j];
      if(b.ini >= a.fin) break;                              // ya no puede solapar
      if(!(a.ini < b.fin && b.ini < a.fin)) continue;         // solape real
      if(a.nrc === b.nrc) continue;                          // mismo NRC
      if(a.lc === "SI" && b.lc === "SI") continue;            // listas cruzadas en ambos
      const key = [a.prof,a.dia,a.nrc,b.nrc,a.ini,a.fin,b.ini,b.fin].join("|");
      if(vistos.has(key)) continue; vistos.add(key);
      pares.push([a,b]);
    }
  }
  pares.sort((x,y)=> x[0].prof.localeCompare(y[0].prof) || (ORD[x[0].dia]||9)-(ORD[y[0].dia]||9) || x[0].ini-y[0].ini);

  reporte = pares.map(([a,b])=>[a.prof, NOM[a.dia]||a.dia, a.cod, a.asig, a.nrc, a.camp, hhmm(a.ini)+" - "+hhmm(a.fin),
                                b.cod, b.asig, b.nrc, b.camp, hhmm(b.ini)+" - "+hhmm(b.fin)]);
  const etiqueta = seleccion.length ? seleccion.join(", ") : "todas las unidades";
  msg(`Unidad(es): ${etiqueta}\nBloques horarios considerados: ${recs.length}\nTopes detectados: ${reporte.length}`);
  vistaPrevia();
  dl.disabled = reporte.length === 0;
}

function vistaPrevia(){
  const n = Math.min(20, reporte.length);
  if(!n){ prev.innerHTML=""; return; }
  let h = "<table><tr>" + HDR.map(x=>`<th>${x}</th>`).join("") + "</tr>";
  for(let i=0;i<n;i++) h += "<tr>" + reporte[i].map(c=>`<td>${c}</td>`).join("") + "</tr>";
  prev.innerHTML = h + "</table>" + (reporte.length>n ? `<p class="sub">Mostrando ${n} de ${reporte.length} filas.</p>` : "");
}

dl.onclick = () => {
  const ws = XLSX.utils.aoa_to_sheet([HDR, ...reporte]);
  ws["!cols"] = [{wch:34},{wch:11},{wch:14},{wch:30},{wch:9},{wch:20},{wch:16},{wch:14},{wch:30},{wch:9},{wch:20},{wch:16}];
  ws["!autofilter"] = {ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:reporte.length, c:11}})};
  ws["!freeze"] = {xSplit:0, ySplit:1};
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Topes de Horario");
  XLSX.writeFile(wb, "Topes de Horario.xlsx");
};
</script>
</body>
</html>
